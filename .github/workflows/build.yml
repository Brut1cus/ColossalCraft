name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        run: ./gradlew build --stacktrace
      - name: GameTests
        # Watchdog: if the game test server is still running after 10 minutes (a hang, e.g. on shutdown), dump every
        # JVM's threads before failing, so the log shows what blocked instead of a bare 30-minute cancellation.
        run: |
          ./gradlew runGameTestServer --stacktrace &
          pid=$!
          for i in $(seq 1 120); do
            if ! kill -0 "$pid" 2>/dev/null; then wait "$pid"; exit $?; fi
            sleep 5
          done
          echo "::error::GameTests still running after 10 minutes; thread dumps follow"
          for p in $(jps -q); do echo "===== jstack $p ($(jps -l | grep "^$p " | cut -d' ' -f2-))"; jstack "$p" || true; done
          kill "$pid" || true
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colossalcraft-jar
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            build/reports/
            run/logs/
