plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.3.0-alpha'
group = 'dev.colossalcraft'
base { archivesName = 'colossalcraft-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories { mavenCentral() }

dependencies {
    // Optional compat targets (Create, Sodium, Iris, ...) are added as compileOnly from their mavens when their
    // colossus.compat.* modules are written. Nothing but NeoForge is ever required at runtime.

    // Phase 2: bundle Jolt Physics (jolt-jni) with jar-in-jar so players still install a single file.
    // Until then colossus.physics.BackendFactory falls back to the built-in XPBD solver.

    // Pure-Java unit tests (physics, IK, gaits, balance, scanner, kinetics). No Minecraft needed.
    testImplementation 'junit:junit:4.13.2'
}

neoForge {
    version = '21.1.266'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', 'colossus' }
    }
    mods { colossus { sourceSet sourceSets.main } }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

// neoforge.mods.toml reads the mod version from the jar manifest (${file.jarVersion}); without it a normal install shows a
// placeholder version
jar {
    manifest {
        attributes(
                'Implementation-Title': 'ColossalCraft',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'ColossalCraft',
                'Specification-Title': 'colossus',
                'Specification-Version': project.version)
    }
}

test {
    useJUnit()
    testLogging { events 'failed'; exceptionFormat 'full' }
}
