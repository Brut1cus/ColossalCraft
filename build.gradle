plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.1.0'
group = 'com.colosalcraft'
base { archivesName = 'colosalcraft-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
// Create (optional dependency): compile against it, only load it at runtime with -PwithCreate
dependencies {
    compileOnly files('libs/create-1.21.1-6.0.0.jar', 'libs/flywheel-neoforge-1.21.1-1.0.0-9.jar', 'libs/Ponder-NeoForge-1.21.1-1.0.39.jar', 'libs/Registrate-MC1.21-1.3.0+62.jar')
    if (project.hasProperty('withCreate')) {
        runtimeOnly files('libs/create-1.21.1-6.0.0.jar', 'libs/flywheel-neoforge-1.21.1-1.0.0-9.jar', 'libs/Ponder-NeoForge-1.21.1-1.0.39.jar', 'libs/Registrate-MC1.21-1.3.0+62.jar')
    }
}
neoForge {
    version = '21.1.266'
    runs {
        client { client() }
        devShots { client(); gameDirectory = project.file('run-devshots'); systemProperty 'colosalcraft.devshots', 'true'; programArguments.addAll('--width', '1280', '--height', '720') }
        server { server(); programArgument '--nogui' }
        gameTestServer { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', 'colosalcraft' }
    }
    mods { colosalcraft { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
